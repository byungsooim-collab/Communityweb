name: 경기 분석 갱신 및 Firebase 배포

on:
  schedule:
    - cron: '17 0,8,16 * * *' # 하루 3회 (KST 09:17, 17:17, 01:17) — 무료 API 한도에 맞춘 주기
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 데이터 수집과 분석
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run collect
      - name: 분석 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: 경기 분석 갱신"
          git push
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
